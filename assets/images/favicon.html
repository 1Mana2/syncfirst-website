
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SyncFirst | S Logo</title>
  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #0D0D33;
    }

    .logo-screen {
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .logo-screen img {
      display: block;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      object-fit: contain;
    }
  </style>
</head>
<body>
  <main class="logo-screen">
    <img src="syncfirst-s-logo.png"
         alt="SyncFirst S Logo">
  </main>
</body>
</html>
